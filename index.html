<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Apex Coach — Trainer Portal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0a0a0a; --ink-2:#141414; --ink-3:#1c1c1c;
    --cream:#f4f1ea; --cream-2:#d9d4c7; --cream-3:#a19d92; --cream-4:#6a6659;
    --line:rgba(244,241,234,.08); --line-strong:rgba(244,241,234,.16);
    --gold:#c9a24a; --gold-2:#e2c169;
    --green:#63c66d; --red:#e2645a; --amber:#e2b054; --blue:#7ab6e2;
    --surface:#111;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--ink); color:var(--cream); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }
  .serif { font-family:'Instrument Serif',Georgia,serif; letter-spacing:.01em; }
  .mono { font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--cream-3); }

  /* ---------- LOGIN ---------- */
  .login-wrap { min-height:100dvh; display:grid; grid-template-columns:1fr; align-items:center; justify-items:center; padding:2rem 1.5rem; background:radial-gradient(ellipse at top, rgba(201,162,74,.06), transparent 60%), var(--ink); }
  .login { width:100%; max-width:420px; }
  .brand-row { display:flex; align-items:center; gap:.7rem; margin-bottom:2.5rem; }
  .brand-mark { width:38px; height:38px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold); font-weight:800; letter-spacing:.05em; }
  .brand-txt { display:flex; flex-direction:column; line-height:1.1; }
  .brand-txt .big { font-family:'Instrument Serif'; font-size:1.35rem; letter-spacing:.01em; }
  .brand-txt .small { color:var(--cream-4); font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; }
  .login h1 { font-family:'Instrument Serif'; font-size:clamp(2rem,6vw,2.75rem); line-height:1.05; margin:0 0 .5rem; letter-spacing:.005em; }
  .login .lead { color:var(--cream-3); font-size:.94rem; line-height:1.6; margin:0 0 2rem; max-width:34ch; }
  .field { display:block; margin-bottom:1rem; }
  .field label { display:block; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--cream-4); margin-bottom:.35rem; }
  .field select, .field input { width:100%; padding:.85rem 1rem; background:var(--ink-2); color:var(--cream); border:1px solid var(--line-strong); border-radius:0; font-size:.95rem; font-family:inherit; outline:none; }
  .field select { appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1l5 5 5-5' stroke='%23a19d92' stroke-width='1.5'/></svg>"); background-repeat:no-repeat; background-position:right 1rem center; padding-right:2.5rem; }
  .field input:focus, .field select:focus { border-color:var(--gold); }
  .cta { width:100%; margin-top:1.2rem; padding:.95rem 1rem; background:var(--cream); color:var(--ink); border:none; font-weight:700; letter-spacing:.05em; font-size:.85rem; text-transform:uppercase; transition:background .15s; }
  .cta:hover { background:var(--gold-2); }
  .login-hint { margin-top:1.4rem; padding:.9rem 1rem; border:1px dashed var(--line-strong); color:var(--cream-3); font-size:.8rem; line-height:1.5; }
  .login-hint b { color:var(--cream); }

  /* ---------- APP ---------- */
  .app { min-height:100dvh; display:grid; grid-template-columns:1fr; }
  @media (min-width: 900px) { .app { grid-template-columns:260px 1fr; } }
  .sidebar { display:none; padding:1.5rem 1.2rem; border-right:1px solid var(--line); background:var(--ink); position:sticky; top:0; height:100dvh; }
  @media (min-width: 900px) { .sidebar { display:flex; flex-direction:column; } }
  .sidebar .brand-row { margin-bottom:2rem; }
  .nav { display:flex; flex-direction:column; gap:.15rem; }
  .nav a { padding:.75rem 1rem; color:var(--cream-3); font-weight:500; font-size:.9rem; border-left:2px solid transparent; display:flex; align-items:center; gap:.75rem; transition:all .15s; }
  .nav a:hover { color:var(--cream); background:var(--ink-2); }
  .nav a.active { color:var(--cream); background:var(--ink-2); border-left-color:var(--gold); }
  .nav .ico { width:16px; opacity:.85; flex:0 0 16px; }
  .nav .group { color:var(--cream-4); font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; padding:1.25rem 1rem .5rem; }
  .side-foot { margin-top:auto; padding-top:1rem; border-top:1px solid var(--line); display:flex; align-items:center; gap:.75rem; }
  .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:800; flex:0 0 36px; }
  .side-foot .who { line-height:1.15; }
  .side-foot .who b { display:block; font-size:.85rem; color:var(--cream); }
  .side-foot .who small { color:var(--cream-4); font-size:.72rem; }
  .side-foot .logout { margin-left:auto; color:var(--cream-4); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; }
  .side-foot .logout:hover { color:var(--cream); }

  /* mobile top bar + drawer */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom:1px solid var(--line); background:var(--ink); position:sticky; top:0; z-index:20; }
  @media (min-width: 900px) { .topbar { display:none; } }
  .hamb { border:1px solid var(--line-strong); background:transparent; color:var(--cream); padding:.5rem .7rem; }
  .drawer { position:fixed; inset:0 auto 0 0; width:82%; max-width:320px; background:var(--ink-2); padding:1.5rem 1.2rem; transform:translateX(-100%); transition:transform .22s; z-index:50; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s; }
  .backdrop.open { opacity:1; pointer-events:auto; }

  /* main */
  .main { padding:1.5rem 1.25rem 4rem; max-width:1200px; margin:0 auto; width:100%; }
  @media (min-width: 900px) { .main { padding:2.5rem 3rem 4rem; } }
  .page-head { display:flex; align-items:end; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:2rem; }
  .page-head h1 { font-family:'Instrument Serif'; font-size:clamp(1.6rem,4.5vw,2.4rem); margin:0 0 .3rem; line-height:1.1; }
  .page-head .sub { color:var(--cream-3); font-size:.9rem; margin:0; }
  .demo-chip { border:1px dashed var(--gold); color:var(--gold-2); padding:.3rem .6rem; font-size:.68rem; letter-spacing:.15em; text-transform:uppercase; }

  /* stats */
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line-strong); border:1px solid var(--line-strong); margin-bottom:2rem; }
  @media (min-width: 700px) { .stats { grid-template-columns:repeat(4,1fr); } }
  .stat { background:var(--ink); padding:1.25rem 1.2rem; display:flex; flex-direction:column; gap:.5rem; min-height:100px; }
  .stat .k { color:var(--cream-4); font-size:.68rem; letter-spacing:.15em; text-transform:uppercase; }
  .stat .v { font-family:'Instrument Serif'; font-size:2rem; line-height:1; margin-top:auto; }
  .stat .v.green { color:var(--green); } .stat .v.gold { color:var(--gold-2); } .stat .v.blue { color:var(--blue); } .stat .v.red { color:var(--red); }
  .stat .delta { color:var(--cream-3); font-size:.75rem; margin-top:.2rem; }

  /* card / table */
  .card { border:1px solid var(--line-strong); background:var(--ink); margin-bottom:1.5rem; }
  .card-head { display:flex; align-items:center; justify-content:space-between; padding:1.1rem 1.25rem; border-bottom:1px solid var(--line); }
  .card-head h2 { font-family:'Instrument Serif'; font-size:1.2rem; margin:0; }
  .card-head .sub { color:var(--cream-4); font-size:.72rem; letter-spacing:.15em; text-transform:uppercase; }
  .card-body { padding:1.25rem; }

  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td { padding:.85rem 1.1rem; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--cream-4); font-weight:500; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; }
  tbody tr:hover { background:var(--ink-2); }
  tbody tr:last-child td { border-bottom:none; }
  .pill { display:inline-flex; align-items:center; gap:.3rem; padding:.15rem .55rem; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; border:1px solid; border-radius:99px; }
  .pill.green { color:var(--green); border-color:rgba(99,198,109,.35); background:rgba(99,198,109,.08); }
  .pill.red { color:var(--red); border-color:rgba(226,100,90,.35); background:rgba(226,100,90,.08); }
  .pill.amber { color:var(--amber); border-color:rgba(226,176,84,.35); background:rgba(226,176,84,.08); }
  .pill.muted { color:var(--cream-3); border-color:var(--line-strong); }

  .row-mem { display:flex; align-items:center; gap:.75rem; }
  .row-mem .av { width:36px; height:36px; border-radius:50%; background:var(--ink-3); color:var(--cream-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; text-transform:uppercase; }
  .row-mem b { font-weight:600; }
  .row-mem small { display:block; color:var(--cream-4); font-size:.75rem; }

  /* week calendar */
  .week { display:grid; grid-template-columns:60px repeat(7, minmax(90px,1fr)); border:1px solid var(--line-strong); overflow-x:auto; }
  .week .cell { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:.6rem .5rem; min-height:60px; font-size:.78rem; }
  .week .head { color:var(--cream-4); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; background:var(--ink-2); }
  .week .time { color:var(--cream-4); background:var(--ink-2); text-align:right; font-size:.72rem; }
  .week .slot { position:relative; }
  .week .slot .booked { position:absolute; inset:.3rem; background:var(--ink-3); border-left:3px solid var(--gold); padding:.35rem .5rem; font-size:.72rem; color:var(--cream); }
  .week .slot .booked b { display:block; font-size:.75rem; }
  .week .slot .booked small { color:var(--cream-3); font-size:.68rem; }

  /* earnings */
  .earnings-grid { display:grid; grid-template-columns:1fr; gap:1.5rem; }
  @media (min-width: 900px) { .earnings-grid { grid-template-columns:1fr 1fr; } }
  .bar { display:grid; grid-template-columns:60px 1fr 70px; gap:.75rem; align-items:center; margin-bottom:.75rem; }
  .bar span:first-child { color:var(--cream-4); font-size:.75rem; }
  .bar span:last-child { text-align:right; font-family:'Instrument Serif'; font-size:1rem; }
  .bar .track { height:8px; background:var(--ink-2); position:relative; overflow:hidden; }
  .bar .fill { position:absolute; top:0; left:0; bottom:0; background:linear-gradient(90deg,var(--gold),var(--gold-2)); }

  .payout { display:flex; align-items:center; justify-content:space-between; padding:.85rem 0; border-bottom:1px solid var(--line); }
  .payout:last-child { border-bottom:none; }
  .payout .l small { display:block; color:var(--cream-4); font-size:.72rem; margin-top:.15rem; }
  .payout .r { text-align:right; font-family:'Instrument Serif'; font-size:1.1rem; }

  /* profile */
  .profile-head { display:flex; align-items:center; gap:1.25rem; padding:1.5rem; border:1px solid var(--line-strong); margin-bottom:1.5rem; }
  .profile-head .av { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:var(--ink); font-weight:800; font-size:2rem; display:flex; align-items:center; justify-content:center; }
  .profile-head h2 { font-family:'Instrument Serif'; margin:0 0 .3rem; font-size:1.6rem; }
  .profile-head .meta { color:var(--cream-3); font-size:.85rem; }
  .kv-grid { display:grid; grid-template-columns:1fr; gap:1px; background:var(--line-strong); border:1px solid var(--line-strong); }
  @media (min-width: 700px) { .kv-grid { grid-template-columns:1fr 1fr; } }
  .kv { padding:1rem 1.25rem; background:var(--ink); }
  .kv .k { color:var(--cream-4); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:.3rem; }
  .kv .v { font-size:.95rem; color:var(--cream); }

  /* empty */
  .empty { padding:3rem 1.5rem; text-align:center; color:var(--cream-4); font-size:.9rem; }

  /* member search + filter chips */
  .search-row { display:flex; flex-direction:column; gap:.75rem; margin-bottom:1.25rem; }
  @media (min-width: 700px) { .search-row { flex-direction:row; align-items:center; } }
  .search-input { flex:1; padding:.85rem 1rem; background:var(--ink-2); color:var(--cream); border:1px solid var(--line-strong); border-radius:0; font-size:.9rem; font-family:inherit; outline:none; }
  .search-input:focus { border-color:var(--gold); }
  .chip-row { display:flex; gap:.4rem; flex-wrap:wrap; }
  .chip { padding:.55rem .9rem; background:transparent; color:var(--cream-3); border:1px solid var(--line-strong); border-radius:99px; font-size:.75rem; letter-spacing:.05em; text-transform:uppercase; transition:all .15s; }
  .chip:hover { color:var(--cream); border-color:var(--cream-4); }
  .chip.active { color:var(--ink); background:var(--gold-2); border-color:var(--gold-2); }

  /* inline goal track */
  .track { height:6px; background:var(--ink-3); position:relative; overflow:hidden; margin-bottom:.3rem; border-radius:99px; }
  .track .fill { position:absolute; top:0; left:0; bottom:0; }

  /* progress log modal */
  .log-overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:60; display:flex; align-items:center; justify-content:center; padding:1rem; }
  .log-modal { width:100%; max-width:520px; background:var(--ink-2); border:1px solid var(--line-strong); }
  .log-head { display:flex; align-items:center; justify-content:space-between; padding:1.1rem 1.25rem; border-bottom:1px solid var(--line); }
  .log-head h3 { margin:0; font-size:1.15rem; }
  .log-close { background:transparent; border:none; color:var(--cream-3); font-size:1.5rem; padding:0 .5rem; }
  .log-body { padding:1.25rem; }
  .log-grid { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-bottom:.75rem; }
  .log-body label { display:flex; flex-direction:column; gap:.3rem; font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--cream-4); }
  .log-body input, .log-body textarea { padding:.7rem .9rem; background:var(--ink); color:var(--cream); border:1px solid var(--line-strong); border-radius:0; font-size:.9rem; font-family:inherit; outline:none; text-transform:none; letter-spacing:normal; }
  .log-body input:focus, .log-body textarea:focus { border-color:var(--gold); }
  .log-notes { margin-bottom:1rem; }
  .log-actions { display:flex; gap:.75rem; align-items:center; }

  /* pill sizes */
  .pill.red { color:var(--red); border-color:rgba(226,100,90,.35); background:rgba(226,100,90,.08); }
  .pill.green { color:var(--green); border-color:rgba(99,198,109,.35); background:rgba(99,198,109,.08); }
  .pill.gold { color:var(--gold-2); border-color:rgba(226,193,105,.35); background:rgba(226,193,105,.06); }

  /* hidden helper */
  .hide { display:none !important; }
</style>
</head>
<body>

<!-- Login turned off for the demo — app boots straight into Junaid Anwar's
     view; use the sidebar avatar (or "Switch" link) to try other trainers. -->

<!-- ================= APP VIEW ================= -->
<div id="appView" class="app">
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark">A</div>
      <div class="brand-txt"><span class="big">Apex Coach</span><span class="small">Trainer Portal</span></div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <div class="side-foot">
      <div class="avatar" id="sideAv">?</div>
      <div class="who"><b id="sideName">—</b><small id="sideRole">Trainer</small></div>
      <a href="#" class="logout" id="logoutBtn">Sign out</a>
    </div>
  </aside>

  <div>
    <div class="topbar">
      <div class="brand-row" style="margin:0;"><div class="brand-mark">A</div><div class="brand-txt"><span class="big">Apex Coach</span></div></div>
      <button class="hamb" id="hambBtn" aria-label="Menu">☰</button>
    </div>
    <main class="main" id="mainContent"></main>
  </div>
</div>

<div class="backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer">
  <div class="brand-row"><div class="brand-mark">A</div><div class="brand-txt"><span class="big">Apex Coach</span></div></div>
  <nav class="nav" id="drawerNav"></nav>
  <div class="side-foot">
    <div class="avatar" id="drawerAv">?</div>
    <div class="who"><b id="drawerName">—</b><small>Trainer</small></div>
    <a href="#" class="logout" id="logoutBtn2">Sign out</a>
  </div>
</aside>

<script src="assets/app.js"></script>
</body>
</html>
